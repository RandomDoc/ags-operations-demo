<style>
:root{
  --navy:#2D2777; --navy-2:#241F63; --navy-3:#3D368F;
  --gold:#F2C72D; --gold-2:#FFDA5C; --gold-wash:#FEF7DD; --gold-ink:#8A6E0B;
  --bg:#F5F4FA; --surface:#FFFFFF; --surface-2:#FAFAFE;
  --line:#E2DFED; --line-2:#EEECF6;
  --text:#17143A; --text-2:#544F70; --text-3:#837E9C;
  --good:#17795E; --good-bg:#E4F3EE;
  --warn:#8A6E0B; --warn-bg:#FCF3DA;
  --bad:#A8322B; --bad-bg:#FAE8E6;
  --info:#3D368F; --info-bg:#EAE8F6;
  --shadow:0 1px 2px rgba(45,39,119,.07), 0 4px 14px rgba(45,39,119,.06);
  --shadow-lg:0 10px 40px rgba(45,39,119,.18);
  --r:10px;
  --sans:"IBM Plex Sans Arabic", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --navy:#1B1745; --navy-2:#141134; --navy-3:#3D368F;
    --bg:#0C0A1C; --surface:#14112B; --surface-2:#1A1638;
    --line:#2E2851; --line-2:#221D42;
    --text:#EDEBF7; --text-2:#AAA4C4; --text-3:#8882A3;
    --gold:#F2C72D; --gold-2:#FFDA5C; --gold-wash:#2A2208; --gold-ink:#F2C72D;
    --good:#4FC49E; --good-bg:#0E2B23;
    --warn:#E8BC4E; --warn-bg:#2A2208;
    --bad:#E88178; --bad-bg:#2E1512;
    --info:#9E97E8; --info-bg:#1E1A42;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg:0 10px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --navy:#1B1745; --navy-2:#141134; --navy-3:#3D368F;
  --bg:#0C0A1C; --surface:#14112B; --surface-2:#1A1638;
  --line:#2E2851; --line-2:#221D42;
  --text:#EDEBF7; --text-2:#AAA4C4; --text-3:#8882A3;
  --gold:#F2C72D; --gold-2:#FFDA5C; --gold-wash:#2A2208; --gold-ink:#F2C72D;
  --good:#4FC49E; --good-bg:#0E2B23;
  --warn:#E8BC4E; --warn-bg:#2A2208;
  --bad:#E88178; --bad-bg:#2E1512;
  --info:#9E97E8; --info-bg:#1E1A42;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-lg:0 10px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
table{border-collapse:collapse;width:100%}
.num{font-variant-numeric:tabular-nums}

.demo-bar{background:linear-gradient(90deg,var(--navy),var(--navy-3));color:#fff;padding:7px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12px}
.demo-bar b{color:var(--gold-2);font-weight:600}
.demo-bar button{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px 11px;font-size:11.5px;color:#fff}
.demo-bar button:hover{background:rgba(255,255,255,.14)}
.demo-bar button.live{border-color:var(--gold);color:var(--gold-2)}

.shell{display:grid;grid-template-columns:238px 1fr;min-height:76vh}
.side{background:var(--navy);color:#DDD9F0;padding:0 0 24px;display:flex;flex-direction:column}
.brand{display:flex;flex-direction:column;gap:9px;align-items:stretch;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}

.logo-tile{background:#fff;border-radius:9px;padding:10px 12px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.logo-tile .logo{height:56px}
.logo-tile.lt-lg{padding:14px 16px;max-width:280px;margin:0 auto}
.logo-tile.lt-lg .logo{height:62px}
.brand-t{font-family:var(--serif);font-size:13.5px;font-weight:700;color:#fff;line-height:1.2}
.brand-s{font-size:10px;color:#A9A3D4;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.navgroup{padding:14px 10px 2px}
.navgroup-h{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#918BC0;padding:0 8px 7px;font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;color:#CFCAEA;font-size:13.2px;margin-bottom:1px}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem[aria-current="true"]{background:var(--gold);color:#241F63;font-weight:600}

function ago(ts){
  var m = Math.max(0, Math.round((Date.now()-ts)/60000));
  if(m<1) return "just now";
  if(m===1) return "1 minute ago";
  if(m<60) return m+" minutes ago";
  var h=Math.round(m/60); return h===1?"1 hour ago":h+" hours ago";
}

/* ---------------- SCORING ---------------- */
function effParts(s){
  var o = S.overrides[s.id]||{}, r={};
  Object.keys(s.parts).forEach(function(k){ r[k] = (o[k]!==undefined ? o[k].val : s.parts[k]); });
  return r;
}
function recalc(s){
  var p = effParts(s), k = Object.keys(p);
  s.score = k.length ? Math.round(k.reduce(function(a,x){ return a+p[x]; },0)/k.length) : 0;
  return s.score;
}

    tile("Live tasks", tk.length, (st.done||0)+" approved, "+(st.submitted||0)+" awaiting") +

      d.responsibilities.map(function(r,i){ return '<div class="resp"><div class="rn">'+(i+1)+'</div><div>'+esc(r)+'</div></div>'; }).join("") + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>Performance against target</h3><span class="sub" style="margin-left:auto">Value vs target</span></div><div class="card-b">' +
      bars(d.kpis) + '<div class="note plain" style="margin-top:12px">These four measures roll up into the department index and into the score of every person measured by them. A department missing target is a management problem before it is an individual one.</div></div></div>' +
  '</div>' +
  '<div class="grid g2">' +
    '<div class="card"><div class="card-h"><h3>People in '+esc(d.name)+'</h3></div><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Index</th><th>Tasks</th></tr></thead><tbody>' +
      people.map(function(s){
        var pt=personTasks(s.id);
        return '<tr class="clickable" data-staff="'+s.id+'"><td>'+personCell(s)+'</td><td>'+scoreBar(s.score)+'</td>' +
          '<td class="num" style="font-size:12.5px;color:var(--text-2)">'+pt.filter(function(t){return t.st==="done";}).length+'/'+pt.length+'</td></tr>';
      }).join("") + '</tbody></table></div></div>' +
    '<div class="card"><div class="card-h"><h3>Live tasks</h3><span class="sub" style="margin-left:auto">Click to open</span></div>' +
      (tk.length?'<div class="tablewrap"><table><thead><tr><th>Task</th><th>Owner</th><th>Status</th></tr></thead><tbody>' +
        tk.map(function(t){
          return '<tr class="clickable '+(t.st==="done"?"done":"")+'" data-task="'+t.id+'">' +
            '<td style="font-weight:500">'+esc(t.t)+'<br><span style="font-size:11px;color:var(--text-3)">Due '+fmtDate(t.due)+'</span></td>' +
            '<td style="font-size:12.3px;color:var(--text-2)">'+esc(staffName(t.who))+'</td><td>'+statusChip(t.st)+'</td></tr>';
        }).join("") + '</tbody></table></div>':'<div class="empty">No live tasks in this department.</div>') +

    2:'<div class="approval"><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><span class="chip bad">Escalation</span><span style="font-size:12px;color:var(--text-3)">to Vice Principal</span></div>' +

            '<div class="nm">Opened by '+esc(r.byName)+' &middot; '+esc(r.ts)+' &middot; next check '+esc(r.when)+'</div></div>';

      '<div class="card"><div class="card-h"><h3>Department duties they are measured against</h3></div><div class="card-b" style="padding:6px 16px 12px">' +

  } else if(tab==="score"){

      comps.map(function(k){
        var v=ep[k], o=ov[k];

          '<div class="bartrack"><span class="barfill" style="width:'+v+'%;background:'+bandColor(v)+'"></span></div><div class="vv num">'+v+'</div>' +
          (isLeader()?'<button class="btn sm" data-override="'+s.id+'|'+encodeURIComponent(k)+'">Override</button>':'') + '</div>';
      }).join("") +
      (Object.keys(ov).length?'<div class="note" style="margin-top:12px"><b>Overrides on this record.</b><br>' +

    '</div></div>':'') +
    '</div></div></div>';
}

    body='<div class="field"><label for="mNote">Note</label><textarea id="mNote" placeholder="What happened, what was agreed, what happens next"></textarea></div>' +
      '<div class="field"><label for="mShare">Visibility</label><select id="mShare">' +
      '<option value="0">Managers only</option><option value="1">Share with the employee</option></select>' +
      '<div class="hint">A shared note appears on the employee&rsquo;s own dashboard. Either way it is stamped with your name and the time.</div></div>';
  } else if(m.type==="assign"){
    title="Assign a task"; sub="To "+s.name; ok="Assign";
    body='<div class="field"><label for="mTitle">Task</label><input type="text" id="mTitle" placeholder="What needs doing"></div>' +
      '<div class="field"><label for="mDesc">Detail</label><textarea id="mDesc" placeholder="What good looks like, and anything they need to know"></textarea></div>' +
      '<div class="frow"><div class="field"><label for="mDue">Due date</label><input type="date" id="mDue" value="2026-10-02"></div>' +
      '<div class="field"><label for="mPri">Priority</label><select id="mPri"><option>Normal</option><option>High</option><option>Critical</option></select></div></div>';
  } else if(m.type==="review"){
    title="Open a performance review"; sub="For "+s.name+", index "+s.score; ok="Open review";
    body='<div class="note" style="margin-bottom:14px">This creates a dated record, notifies '+esc(s.name.split(" ")[0])+', and starts a support-plan timeline both of you can see. It cannot be deleted, only closed with an outcome.</div>' +
      '<div class="field"><label for="mConcern">The concern, in plain terms</label><textarea id="mConcern" placeholder="What specifically is below standard, with the evidence">'+
      esc(m.prefill||"")+'</textarea></div>' +
      '<div class="field"><label for="mPlan">Support plan</label><textarea id="mPlan" placeholder="What support is being offered, and what has to change"></textarea></div>' +
      '<div class="field"><label for="mWhen">Next check-in</label><input type="date" id="mWhen" value="2026-10-17"></div>';
  } else if(m.type==="meet"){
    title="Book a one-to-one"; sub="With "+s.name; ok="Book and send invite";
    body='<div class="frow"><div class="field"><label for="mDate">Date</label><input type="date" id="mDate" value="2026-09-30"></div>' +
      '<div class="field"><label for="mTime">Time</label><input type="time" id="mTime" value="10:30"></div></div>' +
      '<div class="field"><label for="mTopic">Agenda</label><input type="text" id="mTopic" placeholder="What this meeting is about" value="'+esc(m.prefill||"")+'"></div>' +
      '<div class="hint" style="font-size:11.5px;color:var(--text-3)">In the live system this checks Google Calendar for real availability on both sides, avoids prayer times, and sends the invite.</div>';
  } else if(m.type==="override"){
    var cur=(effParts(s))[m.comp];
    title="Override a score component"; sub=m.comp+" for "+s.name; ok="Apply override";
    body='<div class="note" style="margin-bottom:14px">The system calculated <b>'+cur+'</b> from its own records. An override replaces that number, keeps the original visible, and records your reason permanently. '+esc(s.name.split(" ")[0])+' is notified.</div>' +
      '<div class="frow"><div class="field"><label for="mVal">New value (0 to 100)</label><input type="number" id="mVal" min="0" max="100" value="'+cur+'"></div>' +
      '<div class="field"><label>System value</label><input type="text" value="'+cur+'" disabled></div></div>' +
      '<div class="field"><label for="mReason">Reason, required</label><textarea id="mReason" placeholder="Why the system number does not reflect reality"></textarea></div>';
  } else if(m.type==="reassign"){
    var t=getTask(m.taskId);
    title="Reassign task"; sub=t.t; ok="Reassign";
    body='<div class="field"><label for="mWho">New owner</label><select id="mWho">' +
      STAFF.filter(function(x){return x.id!==24;}).map(function(x){ return '<option value="'+x.id+'"'+(x.id===t.who?" selected":"")+'>'+esc(x.name)+', '+esc(x.role)+'</option>'; }).join("") + '</select></div>' +
      '<div class="field"><label for="mWhy">Note for the log</label><input type="text" id="mWhy" placeholder="Why it is moving"></div>';
  } else if(m.type==="return"){
    var t2=getTask(m.taskId);
    title="Return this work"; sub=t2.t; ok="Return to "+staffName(t2.who).split(" ")[0];
    body='<div class="field"><label for="mComment">What needs to change</label><textarea id="mComment" placeholder="Be specific, this goes to them as written"></textarea></div>' +
      '<div class="hint" style="font-size:11.5px;color:var(--text-3)">The task goes back to in progress with your comment attached. It is not counted as late again for the return itself.</div>';
  }

  return '<div class="modal-scrim" id="modalScrim"><div class="modal" role="dialog" aria-label="'+esc(title)+'">' +
    '<div class="modal-h"><div style="flex:1"><h3>'+title+'</h3><div class="ms">'+sub+'</div></div>' +
    '<button class="closeb" data-act="closemodal" aria-label="Close">&times;</button></div>' +
    '<div class="modal-b">'+body+'</div>' +
    '<div class="modal-f"><button class="btn" data-act="closemodal">Cancel</button>' +
    '<button class="btn gold" data-act="savemodal">'+ok+'</button></div></div></div>';
}

/* ---------------- ACTIONS ---------------- */
function meName(){ return ROLES[S.role].name; }
function logTask(t, text){ t.log.unshift(["26 Sep "+clockNow(), text]); }

function submitTask(id){
  var t=getTask(id); if(!t) return;
  t.st="submitted"; logTask(t,"Submitted for approval by "+staffName(t.who));
  pushFeed("submit", t.who, "submitted <b>"+esc(t.t)+"</b> for approval", t.id);
  render(); toast("Sent to <b>"+esc(staffName(byId(t.who).mgrId))+"</b> for approval.");
}
function approveTask(id){
  var t=getTask(id); if(!t) return;
  t.st="done"; logTask(t,"Approved by "+meName());
  pushFeed("approve", ROLES[S.role].staffId, "approved <b>"+esc(t.t)+"</b> from "+esc(staffName(t.who)), t.id);
  render(); toast("Approved. It now counts toward <b>"+esc(staffName(t.who))+"</b>&rsquo;s on-time record.");
}
function returnTask(id, comment){
  var t=getTask(id); if(!t) return;
  t.st="progress"; logTask(t,"Returned by "+meName()+": "+comment);
  pushFeed("ret", ROLES[S.role].staffId, "returned <b>"+esc(t.t)+"</b> to "+esc(staffName(t.who))+" with a comment", t.id);
  render(); toast("Returned to <b>"+esc(staffName(t.who))+"</b> with your comment.");
}
function reopenTask(id){
  var t=getTask(id); if(!t) return;
  t.st="open"; logTask(t,"Reopened by "+meName());
  render(); toast("Task reopened.");
}
function fireLive(manual){
  if(S.liveIdx>=LIVE_EVENTS.length){ if(manual) toast("All scripted submissions have arrived. Reset the demo to run them again."); return; }
  var e=LIVE_EVENTS[S.liveIdx++];
  var t={id:++taskSeq,t:e.t,who:e.who,dept:e.dept,st:"submitted",due:"2026-09-26",pri:"Normal",d:e.d,
    log:[["26 Sep "+clockNow(),"Submitted for approval by "+staffName(e.who)]]};
  S.tasks.unshift(t);
  pushFeed("submit", e.who, "submitted <b>"+esc(e.t)+"</b> for approval", t.id);
  render();
  toast("<b>"+esc(staffName(e.who))+"</b> just submitted work for approval.");
}
function startLive(){
  if(S.liveTimer) clearInterval(S.liveTimer);
  S.liveTimer=setInterval(function(){
    if(!S.live || S.modal) return;
    var a=document.activeElement;
    if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")) return;
    fireLive(false);
  }, 20000);
}

function saveModal(){
  var m=S.modal; if(!m) return;
  var s=m.staffId?byId(m.staffId):null;
  var v=function(id){ var el=document.getElementById(id); return el?el.value.trim():""; };

  if(m.type==="note"){
    var txt=v("mNote"); if(!txt){ toast("Write the note first."); return; }
    var share=v("mShare")==="1";
    (S.notes[s.id]=S.notes[s.id]||[]).unshift({text:txt,by:meName(),ts:"26 Sep "+clockNow(),share:share});
    pushFeed("note", ROLES[S.role].staffId, "added a note to <b>"+esc(s.name)+"</b>&rsquo;s record"+(share?", shared with the employee":""));
    S.modal=null; S.drawerTab="notes"; render(); toast("Note saved to <b>"+esc(s.name)+"</b>&rsquo;s record.");

  } else if(m.type==="assign"){
    var ti=v("mTitle"); if(!ti){ toast("Give the task a name first."); return; }
    var t={id:++taskSeq,t:ti,who:s.id,dept:s.dept,st:"open",due:v("mDue")||"2026-10-02",pri:v("mPri")||"Normal",
      d:v("mDesc")||("Assigned by "+meName()+"."),log:[["26 Sep "+clockNow(),"Created and assigned to "+s.name+" by "+meName()]]};
    S.tasks.unshift(t);
    pushFeed("assign", ROLES[S.role].staffId, "assigned <b>"+esc(ti)+"</b> to "+esc(s.name), t.id);
    S.modal=null; S.drawerTab="tasks"; render(); toast("Assigned to <b>"+esc(s.name)+"</b>. It is on their dashboard now.");

  } else if(m.type==="review"){
    var c=v("mConcern"), p=v("mPlan");
    if(!c||!p){ toast("Both the concern and the support plan are required."); return; }
    S.reviews.unshift({id:Date.now(),staffId:s.id,by:ROLES[S.role].staffId,byName:meName(),concern:c,plan:p,
      when:v("mWhen")||"2026-10-17",ts:"26 Sep "+clockNow()});
    pushFeed("review", ROLES[S.role].staffId, "opened a performance review for <b>"+esc(s.name)+"</b>");
    S.modal=null; S.drawerTab="overview"; render(); toast("Review opened. <b>"+esc(s.name)+"</b> has been notified.");

  } else if(m.type==="meet"){
    var d=v("mDate"), tm=v("mTime"), tp=v("mTopic")||"One to one";
    S.meetings.unshift({id:Date.now(),staffId:s.id,by:ROLES[S.role].staffId,byName:meName(),
      when:fmtDate(d)+" at "+tm,topic:tp});
    pushFeed("meet", ROLES[S.role].staffId, "booked a 1:1 with <b>"+esc(s.name)+"</b> for "+fmtDate(d)+" at "+tm);
    S.modal=null; render(); toast("Booked. Invite sent to <b>"+esc(s.name)+"</b>.");

  } else if(m.type==="override"){
    var nv=parseInt(v("mVal"),10), rs=v("mReason");
    if(isNaN(nv)||nv<0||nv>100){ toast("Enter a value between 0 and 100."); return; }
    if(!rs){ toast("A written reason is required for any override."); return; }
    (S.overrides[s.id]=S.overrides[s.id]||{})[m.comp]={val:nv,reason:rs,by:meName(),ts:"26 Sep "+clockNow()};
    var before=s.score; recalc(s);
    pushFeed("override", ROLES[S.role].staffId, "overrode <b>"+esc(m.comp)+"</b> on "+esc(s.name)+"&rsquo;s record, index "+before+" to "+s.score);
    S.modal=null; S.drawerTab="score"; render();
    toast("Override applied. Index moved <b>"+before+" to "+s.score+"</b>.");

  } else if(m.type==="reassign"){
    var t3=getTask(m.taskId); var nw=byId(parseInt(v("mWho"),10));
    var old=staffName(t3.who);
    t3.who=nw.id; t3.dept=nw.dept;
    logTask(t3,"Reassigned from "+old+" to "+nw.name+" by "+meName()+(v("mWhy")?": "+v("mWhy"):""));
    pushFeed("assign", ROLES[S.role].staffId, "reassigned <b>"+esc(t3.t)+"</b> from "+esc(old)+" to "+esc(nw.name), t3.id);
    S.modal=null; render(); toast("Moved to <b>"+esc(nw.name)+"</b>.");

  } else if(m.type==="return"){
    var cm=v("mComment"); if(!cm){ toast("Say what needs to change."); return; }
    S.modal=null; returnTask(m.taskId, cm);
  }
}

/* ---------------- RENDER ---------------- */
function render(){
  var R=ROLES[S.role];
  if(R.nav.indexOf(S.view)===-1) S.view=R.nav[0];
  var pend=pendingApprovals().length;

  document.getElementById("navGroup").innerHTML='<div class="navgroup-h">'+esc(R.scope)+'</div>' +
    R.nav.map(function(v){
      var V=VIEWS[v], badge="";
      if(v==="me" && isLeader() && pend) badge='<span class="pill">'+pend+'</span>';
      if(v==="agents" && S.queue.length && isLeader()) badge='<span class="pill">'+S.queue.length+'</span>';
      if(v==="hr" && ["vp","ceo","hr"].indexOf(S.role)>-1) badge='<span class="pill">3</span>';
      return '<button class="navitem" data-view="'+v+'" aria-current="'+(v===S.view)+'">' +
        '<span class="ic" aria-hidden="true">'+V.icon+'</span><span>'+V.label+'</span>'+badge+'</button>';
    }).join("");

  document.getElementById("waName").textContent=R.name;
  document.getElementById("waRole").textContent=R.title;
  document.getElementById("waAv").textContent=initials(R.name);

  var map={me:viewMe,overview:viewOverview,exec:viewExec,departments:viewDepartments,people:viewPeople,
           tasks:viewTasks,hr:viewHR,agents:viewAgents,integrations:viewIntegrations,roadmap:viewRoadmap};
  document.getElementById("canvas").innerHTML=(map[S.view]||viewMe)();

  var dm=document.getElementById("drawerMount");
  if(S.openStaff) dm.innerHTML=staffDrawer(byId(S.openStaff));
  else if(S.openTask){ var t=getTask(S.openTask); dm.innerHTML=t?taskDrawer(t):""; }
  else dm.innerHTML="";

  document.getElementById("modalMount").innerHTML=modalHTML();
  var first=document.querySelector(".modal-b textarea, .modal-b input");
  if(first) first.focus();

  setTimeout(function(){ S.feed.forEach(function(f){ f.fresh=false; }); }, 1200);
}

/* ---------------- EVENTS ---------------- */
var sel=document.getElementById("roleSel");
sel.innerHTML=Object.keys(ROLES).map(function(k){ return '<option value="'+k+'">'+esc(ROLES[k].name)+', '+esc(ROLES[k].title)+'</option>'; }).join("");
sel.value=S.role;
sel.addEventListener("change",function(e){
  S.role=e.target.value; S.openStaff=null; S.openTask=null; S.dept=null; S.modal=null;
  S.fDept="all"; S.fStatus="all"; S.q=""; S.view=ROLES[S.role].nav[0];
  render(); toast("Signed in as "+esc(ROLES[S.role].name)+".");
});
document.getElementById("quickGrid").innerHTML=Object.keys(ROLES).map(function(k){
  return '<button class="quickbtn" data-role="'+k+'"><b>'+esc(ROLES[k].title)+'</b><span>'+esc(ROLES[k].name)+'</span></button>';
}).join("");

document.addEventListener("click",function(e){
  var el;
  if((el=e.target.closest("[data-act]"))){
    var a=el.dataset.act;
    if(a==="closemodal"){ S.modal=null; render(); return; }
    if(a==="savemodal"){ saveModal(); return; }
    if(a==="togglelive"){ S.live=!S.live; render(); toast(S.live?"Live feed resumed.":"Live feed paused."); return; }
    if(a==="simulate"){ fireLive(true); return; }
    if(a==="clearf"){ S.q=""; S.fDept="all"; S.fStatus="all"; render(); return; }
    if(a==="addtask"){
      var ti=document.getElementById("ntTitle"), wh=document.getElementById("ntWho"), du=document.getElementById("ntDue");
      if(!ti.value.trim()){ toast("Give the task a name first."); ti.focus(); return; }
      var o=byId(parseInt(wh.value,10));
      var t={id:++taskSeq,t:ti.value.trim(),who:o.id,dept:o.dept,st:"open",due:du.value||"2026-10-02",pri:"Normal",
        d:"Assigned by "+meName()+" from the task board.",log:[["26 Sep "+clockNow(),"Created and assigned to "+o.name+" by "+meName()]]};
      S.tasks.unshift(t);
      pushFeed("assign", ROLES[S.role].staffId, "assigned <b>"+esc(t.t)+"</b> to "+esc(o.name), t.id);
      render(); toast("Assigned to <b>"+esc(o.name)+"</b>."); return;
    }
    if(a==="nudge"){ toast("Reminder sent to the owner and copied to their manager."); return; }
    if(a==="iqama"){ toast("Iqama file opened. HR access only, view logged."); return; }
    return;
  }
  if((el=e.target.closest("[data-view]"))){ S.view=el.dataset.view; S.openStaff=null; S.openTask=null; S.dept=null; S.q=""; S.fDept="all"; S.fStatus="all"; render(); window.scrollTo(0,0); return; }
  if((el=e.target.closest("[data-dept]"))){ var d=el.dataset.dept; S.dept=(d==="__back")?null:d; S.view="departments"; S.openStaff=null; S.openTask=null; render(); window.scrollTo(0,0); return; }
  if((el=e.target.closest("[data-submit-task]"))){ e.stopPropagation(); submitTask(parseInt(el.dataset.submitTask,10)); return; }
  if((el=e.target.closest("[data-approve-task]"))){ e.stopPropagation(); approveTask(parseInt(el.dataset.approveTask,10)); return; }
  if((el=e.target.closest("[data-return-task]"))){ e.stopPropagation(); S.modal={type:"return",taskId:parseInt(el.dataset.returnTask,10)}; render(); return; }
  if((el=e.target.closest("[data-reopen]"))){ e.stopPropagation(); reopenTask(parseInt(el.dataset.reopen,10)); return; }
  if((el=e.target.closest("[data-reassign]"))){ e.stopPropagation(); S.modal={type:"reassign",taskId:parseInt(el.dataset.reassign,10)}; render(); return; }
  if((el=e.target.closest("[data-note]"))){ e.stopPropagation(); S.modal={type:"note",staffId:parseInt(el.dataset.note,10)}; render(); return; }
  if((el=e.target.closest("[data-assign]"))){ e.stopPropagation(); S.modal={type:"assign",staffId:parseInt(el.dataset.assign,10)}; render(); return; }
  if((el=e.target.closest("[data-meet]"))){ e.stopPropagation(); S.modal={type:"meet",staffId:parseInt(el.dataset.meet,10),prefill:"Performance check-in"}; render(); return; }
  if((el=e.target.closest("[data-review]"))){
    e.stopPropagation();
    var rs=byId(parseInt(el.dataset.review,10));
    var weak=Object.keys(effParts(rs)).sort(function(a,b){ return effParts(rs)[a]-effParts(rs)[b]; })[0];
    S.modal={type:"review",staffId:rs.id,prefill:weak?(weak+" is at "+effParts(rs)[weak]+" against a department target, and has been below standard for the term."):""};
    render(); return;
  }
  if((el=e.target.closest("[data-override]"))){
    e.stopPropagation();
    var parts=el.dataset.override.split("|");
    S.modal={type:"override",staffId:parseInt(parts[0],10),comp:decodeURIComponent(parts[1])};
    render(); return;
  }
  if((el=e.target.closest("[data-staff]"))){ S.openStaff=parseInt(el.dataset.staff,10); S.openTask=null; S.drawerTab="overview"; render(); return; }
  if((el=e.target.closest("[data-task]"))){ S.openTask=parseInt(el.dataset.task,10); S.openStaff=null; render(); return; }
  if((el=e.target.closest("[data-dtab]"))){ S.drawerTab=el.dataset.dtab; render(); return; }
  if((el=e.target.closest("[data-status]"))){ S.fStatus=el.dataset.status; render(); return; }
  if((el=e.target.closest("[data-agent]"))){ var k=el.dataset.agent; S.agents[k]=!S.agents[k]; render(); toast("Agent "+(S.agents[k]?"activated":"paused")+"."); return; }
  if((el=e.target.closest("[data-approve]"))){ var q=parseInt(el.dataset.approve,10); S.queue=S.queue.filter(function(x){return x!==q;}); render(); toast(q===1?"Reply sent from Layla&rsquo;s address.":"Escalation accepted and assigned to you."); return; }
  if((el=e.target.closest("[data-discard]"))){ var q2=parseInt(el.dataset.discard,10); S.queue=S.queue.filter(function(x){return x!==q2;}); render(); toast("Draft discarded. Nothing was sent."); return; }
  if((el=e.target.closest("[data-role]"))){
    S.role=el.dataset.role; sel.value=S.role; S.openStaff=null; S.openTask=null; S.dept=null; S.modal=null; S.view=ROLES[S.role].nav[0];
    document.getElementById("loginScrim").classList.add("hidden"); render(); toast("Signed in as "+esc(ROLES[S.role].name)+"."); return;
  }
  if(e.target.id==="modalScrim"){ S.modal=null; render(); return; }
  if(e.target.closest("#drawerClose")||e.target.id==="drawerScrim"){ S.openStaff=null; S.openTask=null; render(); return; }
  if(e.target.id==="showLogin"){ document.getElementById("loginScrim").classList.remove("hidden"); return; }
  if(e.target.id==="lgGo"||e.target.id==="loginScrim"){ document.getElementById("loginScrim").classList.add("hidden"); return; }
  if(e.target.id==="simBtn"){ fireLive(true); return; }
  if(e.target.id==="themeBtn"){
    var cur=document.documentElement.getAttribute("data-theme");
    var isDark=cur==="dark"||(!cur&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme",isDark?"light":"dark"); return;
  }
  if(e.target.id==="resetBtn"){
    S.tasks=JSON.parse(JSON.stringify(SEED_TASKS));
    STAFF=JSON.parse(JSON.stringify(BASE_STAFF)); STAFF.forEach(recalc);
    S.notes={}; S.reviews=[]; S.meetings=[]; S.overrides={};
    S.queue=[1,2]; S.agents={triage:true,faq:true,sched:true,draft:true,escal:true};
    S.q=""; S.fDept="all"; S.fStatus="all"; S.openStaff=null; S.openTask=null; S.dept=null; S.modal=null;
    S.liveIdx=0; taskSeq=500; feedSeq=0; seedFeed();
    render(); toast("Demo reset. All scripted submissions are queued again."); return;
  }
});

document.addEventListener("input",function(e){
  if(e.target.id==="qBox"){
    S.q=e.target.value; render();
    var b=document.getElementById("qBox");
    if(b){ b.focus(); b.setSelectionRange(b.value.length,b.value.length); }
  }
});
document.addEventListener("change",function(e){
  if(e.target.id==="deptFilter"){ S.fDept=e.target.value; render(); }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(S.modal){ S.modal=null; render(); return; }
    S.openStaff=null; S.openTask=null;
    document.getElementById("loginScrim").classList.add("hidden"); render();
  }
});

render();
startLive();
</script>
